source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = Iosevka Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/hypr/wallpapers/lock.png
  blur_passes = 2
  blur_size = 3
  color = $base
  contrast = 1
  brightness = 0.75
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}


# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = 0, -250
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, -400
  halign = center
  valign = top
}

image {
   monitor = DP-3
   path = $HOME/.config/hypr/wallpapers/flying_squirrel.png
   border_size = 0
   halign = left
   valign = bottom
}

label {
  monitor = DP-3
  text = squirrel love!
  halign = left
  valign = bottom 
  position = 128, 56
  font_size = 12
  font_family = $font
  color = $mauve
}

# INPUT FIELD
input-field {
  monitor = DP-3
  size = 300, 60
  outline_thickness = 2
  dots_size = 0.4
  dots_spacing = 0.1
  dots_center = true
  dots_text_format = *
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  font_family = $font
  fade_on_empty = false
  hide_input = false
  placeholder_text = 
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
  rounding = 0
}
